name: Build Ace 5 GKI Kernel

on:
  workflow_dispatch:
    inputs:
      kernel_family:
        description: "GKI kernel family"
        required: true
        default: "android15-6.1"
      patch_level:
        description: "GKI patch level"
        required: true
        default: "2025-11"
      root_impl:
        description: "Root implementation"
        required: true
        default: "KernelSU-Next"
        type: choice
        options:
          - KernelSU-Next
          - KernelSU
          - BakaSU
          - FinaSU
          - SukiSU-Ultra
          - KowSU
      enable_susfs:
        description: "Enable SUSFS"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      enable_docker:
        description: "Enable Docker / DroidSpaces"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      enable_storage:
        description: "Enable CIFS / FUSE / NTFS / USB storage"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  build:
    name: GKI Build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone WildKernels GKI repo
        run: |
          git clone --depth=1 \
            https://github.com/WildKernels/OnePlus_KernelSU_SUSFS.git wk

      - name: Trigger repo build workflow
        run: |
          set -euo pipefail

          cd wk

          WF=$(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) | head -n1)

          if [ -z "$WF" ]; then
            echo "::error::No workflow found in WildKernels repo."
            exit 1
          fi

          echo "Workflow file: $WF"

          KSU="${{ github.event.inputs.root_impl }}"
          SUSFS="${{ github.event.inputs.enable_susfs }}"
          DOCKER="${{ github.event.inputs.enable_docker }}"
          STORAGE="${{ github.event.inputs.enable_storage }}"
          FAMILY="${{ github.event.inputs.kernel_family }}"
          PATCH="${{ github.event.inputs.patch_level }}"

          if grep -q "kernel_family\|kernel_branch\|gki_branch\|kernel_version" "$WF"; then
            sed -i "s|default: .*|default: \"$FAMILY\"|" "$WF"
          fi

          if grep -q "patch_level\|android_patch\|gki_patch" "$WF"; then
            sed -i "s|default: .*|default: \"$PATCH\"|" "$WF"
          fi

          if grep -q "root_impl\|ksu_variant\|ksu_impl" "$WF"; then
            sed -i "s|default: .*|default: \"$KSU\"|" "$WF"
          fi

          if grep -q "enable_susfs\|susfs" "$WF"; then
            sed -i "s|default: .*|default: \"$SUSFS\"|" "$WF"
          fi

          if grep -q "enable_docker\|droidspaces\|container" "$WF"; then
            sed -i "s|default: .*|default: \"$DOCKER\"|" "$WF"
          fi

          if grep -q "enable_storage\|cifs\|fuse\|ntfs\|usb_storage" "$WF"; then
            sed -i "s|default: .*|default: \"$STORAGE\"|" "$WF"
          fi

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .github/workflows/
          git commit -m "ci: set GKI build params" || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GKI_KernelSU_SUSFS
          path: |
            wk/out/
            wk/build/
            wk/artifacts/
            wk/*AnyKernel*.zip
            wk/*-AK3.zip
          if-no-files-found: warn
